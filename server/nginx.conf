map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name omni-api.pioneerxity.ai;

    # HTTPS server
    listen 443 ssl http2;          # http2 is nice for performance
    ssl_certificate /etc/letsencrypt/live/omni-api.pioneerxity.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omni-api.pioneerxity.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Important for realtime / voice sessions
        proxy_read_timeout 3600;      # 1 hour - adjust based on your max session time
        proxy_send_timeout 3600;
        proxy_connect_timeout 60;

        # Optional: disable buffering for lower latency streaming
        proxy_buffering off;
        proxy_cache off;
        tcp_nodelay on;               # good for realtime

        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}

# Simple HTTP → HTTPS redirect
server {
    listen 80;
    server_name omni-api.pioneerxity.ai;
    return 301 https://$host$request_uri;
}